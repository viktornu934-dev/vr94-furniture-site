media:
  input: site/media
  output: /media
  rename: safe
  categories: [image]

content:
  - name: projects
    label: Каталог и фотографии проектов
    type: file
    path: site/data/projects.json
    format: json
    list: true
    view:
      fields: [title, category]
      primary: title
    fields:
      - name: title
        label: Название проекта
        type: string
        required: true
      - name: category
        label: Рубрика каталога
        type: select
        required: true
        options:
          values:
            - Кухни
            - Шкафы и гардеробные
            - Гостиные и ТВ-зоны
            - Спальни
            - Прихожие
            - Мягкая мебель
            - Школьная мебель
            - Другое
      - name: image
        label: Фотография проекта
        type: image
        required: true
        options:
          path: portfolio
          extensions: [jpg, jpeg, png, webp]
      - name: description
        label: Краткое описание
        type: text
      - name: alt
        label: Описание фотографии для доступности
        type: string
      - name: year
        label: Год проекта (необязательно)
        type: string

  - name: site
    label: Контакты и подпись
    type: file
    path: site/data/site.json
    format: json
    fields:
      - name: address
        label: Адрес
        type: string
      - name: instagram
        label: Ссылка Instagram
        type: string
      - name: instagramHandle
        label: Имя Instagram
        type: string
      - name: weekdayHours
        label: График Пн–Пт
        type: string
      - name: saturdayHours
        label: График Сб
        type: string
      - name: corporateName
        label: Имя контакта — корпусная мебель
        type: string
      - name: corporatePhone
        label: Телефон — корпусная мебель
        type: string
      - name: softName
        label: Имя контакта — мягкая мебель
        type: string
      - name: softPhone
        label: Телефон — мягкая мебель
        type: string
